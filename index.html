<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA Inter Pro Revision Station</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #040711;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Perfect 9:16 WhatsApp Status Ratio Card */
    .status-card {
      width: 360px;
      height: 640px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen py-6 px-3 flex flex-col items-center justify-start">

  <!-- Mobile Top Dashboard Header -->
  <header class="w-full max-w-md flex items-center justify-between px-2 mb-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-indigo-500/25">
        CA
      </div>
      <div>
        <h1 class="text-sm font-black tracking-tight text-white flex items-center gap-1.5">
          CA INTER HUB <span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">PRO</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">Daily 9:16 WhatsApp Status Engine</p>
      </div>
    </div>

    <!-- Mode Selector: Status vs Quick Quiz -->
    <div class="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl">
      <button onclick="switchView('status')" id="btn-status" class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-indigo-600 text-white transition-all">Poster</button>
      <button onclick="switchView('quiz')" id="btn-quiz" class="px-2.5 py-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition-all">Quiz</button>
    </div>
  </header>

  <!-- Horizontal Scrollable Subject Days Carousel -->
  <div class="w-full max-w-md overflow-x-auto hide-scrollbar flex gap-2 pb-3 px-1">
    <button onclick="setDay(0)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center border border-cyan-500/50 bg-cyan-950/40">
      <span class="text-[9px] mono font-bold text-cyan-400">DAY 01</span>
      <span class="text-xs font-black text-white">Acc: ALICE</span>
    </button>
    <button onclick="setDay(1)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-cyan-400">DAY 02</span>
      <span class="text-xs font-black text-slate-300">Acc: Cap/Rev</span>
    </button>
    <button onclick="setDay(2)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-emerald-400">DAY 03</span>
      <span class="text-xs font-black text-slate-300">Law: Veil</span>
    </button>
    <button onclick="setDay(3)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-emerald-400">DAY 04</span>
      <span class="text-xs font-black text-slate-300">Law: MOA/AOA</span>
    </button>
    <button onclick="setDay(4)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-amber-400">DAY 05</span>
      <span class="text-xs font-black text-slate-300">GST: Supply</span>
    </button>
    <button onclick="setDay(5)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-amber-400">DAY 06</span>
      <span class="text-xs font-black text-slate-300">GST: RCM</span>
    </button>
    <button onclick="setDay(6)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-purple-400">DAY 07</span>
      <span class="text-xs font-black text-slate-300">Tax: PY & AY</span>
    </button>
    <button onclick="setDay(7)" class="day-tab flex-shrink-0 px-3.5 py-2 rounded-2xl glass-pill flex flex-col items-center">
      <span class="text-[9px] mono font-bold text-purple-400">DAY 08</span>
      <span class="text-xs font-black text-slate-300">Tax: Rebate 87A</span>
    </button>
  </div>

  <!-- Action Bar -->
  <div class="w-full max-w-md flex items-center justify-between gap-2.5 my-2 px-1">
    <button onclick="downloadStatusPNG()" class="flex-1 py-2.5 px-4 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 active:scale-95 transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      Download Poster (PNG)
    </button>
    <button onclick="copyCaption()" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs flex items-center gap-1.5 border border-slate-700 active:scale-95 transition-all">
      <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
      <span id="captionBtnText">Copy Caption</span>
    </button>
  </div>

  <!-- Main 9:16 WhatsApp Status Card -->
  <div id="statusContainer" class="status-card flex flex-col justify-between p-5 text-white border transition-all mt-1">
    <!-- Dynamic Injected Canvas Content -->
  </div>

  <!-- Quiz Mode Container (Hidden by default) -->
  <div id="quizContainer" class="status-card hidden flex-col justify-between p-5 text-white border border-indigo-500/40 bg-slate-950 mt-1">
    <div>
      <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
        <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
          ICAI RAPID FIRE TEST
        </span>
        <span class="text-[10px] mono text-slate-400" id="quizDayTag">Day 01</span>
      </div>
      <div class="mt-4">
        <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Concept Check</span>
        <h3 class="text-sm font-extrabold mt-1 text-white leading-snug" id="quizQuestion">Loading question...</h3>
      </div>
      <div class="mt-4 space-y-2" id="quizOptions">
        <!-- Injected options -->
      </div>
    </div>

    <div class="p-3 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] text-slate-300" id="quizExplanation">
      💡 Tap an option to verify your exam concept logic!
    </div>
  </div>

      // Update carousel tab styling

        if(i === index) {
          tab.classList.add('border-indigo-400', 'bg-indigo-900/40', 'scale-105');
          tab.querySelector('span:last-child').classList.remove('text-slate-300');
          tab.querySelector('span:last-child').classList.add('text-white');
        } else {
          tab.classList.remove('border-indigo-400', 'bg-indigo-900/40', 'scale-105');
          tab.querySelector('span:last-child').classList.add('text-slate-300');
          tab.querySelector('span:last-child').classList.remove('text-white');
        }
      });

      renderStatusCard();
      renderQuiz();
    }

    function renderStatusCard() {
      const data = curriculum[currentDayIndex];
      const card = document.getElementById('statusContainer');
      
      card.style.background = data.bgGradient;
      card.style.borderColor = data.borderColor;

      card.innerHTML = `
        <!-- Top Status Header -->
        <div>
          <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full animate-ping" style="background-color: ${data.themeColor}"></span>
              <span class="text-[9.5px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full border glass-pill" style="color: ${data.themeColor}; border-color: ${data.borderColor}">
                ${data.day} • ${data.subject}
              </span>
            </div>
            <span class="text-[9px] mono font-bold text-slate-400 uppercase tracking-widest">ICAI MODULE CORE</span>
          </div>

          <div class="mt-2.5 flex items-start gap-2.5">
            <div class="p-2 rounded-2xl glass-pill shrink-0">
              ${data.iconSvg}
            </div>
            <div>
              <span class="text-[9px] font-black uppercase tracking-widest text-amber-300">Foundation Pillar</span>
              <h2 class="text-sm font-black text-white leading-tight mt-0.5">${data.badge}</h2>
            </div>
          </div>
        </div>

        <!-- 2 Comparison High-Contrast Columns -->
        <div class="space-y-2 my-auto">
          <!-- Pillar 1 -->
          <div class="p-2.5 rounded-2xl glass-pill border border-white/10">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-xs font-black text-amber-300">${data.col1Title}</h4>
              <span class="text-[8.5px] mono font-bold bg-white/10 px-1.5 py-0.5 rounded text-slate-300">${data.col1Sub}</span>
            </div>
            <div class="space-y-0.5">
              ${data.col1Points.map(p => `<p class="text-[10px] text-slate-200 leading-snug font-medium">${p}</p>`).join('')}
            </div>
          </div>

          <!-- Pillar 2 -->
          <div class="p-2.5 rounded-2xl glass-pill border border-white/10">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-xs font-black text-cyan-300">${data.col2Title}</h4>
              <span class="text-[8.5px] mono font-bold bg-white/10 px-1.5 py-0.5 rounded text-slate-300">${data.col2Sub}</span>
            </div>
            <div class="space-y-0.5">
              ${data.col2Points.map(p => `<p class="text-[10px] text-slate-200 leading-snug font-medium">${p}</p>`).join('')}
            </div>
          </div>

          <!-- ICAI Trap Box -->
          <div class="p-2 rounded-xl bg-red-950/40 border border-red-500/30">
            <div class="flex items-center gap-1 text-[9px] font-extrabold text-red-400 uppercase tracking-wider">
              <span>⚠️ ICAI Exam Trap:</span>
            </div>
            <p class="text-[9.5px] text-slate-200 mt-0.5 leading-snug font-medium">${data.icaiTrap}</p>
          </div>
        </div>

        <!-- Bottom Exam Memory Hack & Branding -->
        <div class="space-y-1.5 pt-2 border-t border-white/10">
          <div class="p-2 rounded-xl bg-gradient-to-r from-amber-500/20 via-indigo-500/20 to-emerald-500/20 border border-amber-400/40 text-center">
            <span class="text-[9px] font-black uppercase text-amber-300 tracking-wider">⚡ 10-Second Memory Hack</span>
            <p class="text-[10px] font-bold text-white leading-tight mt-0.5">${data.examHack}</p>
          </div>

          <div class="flex items-center justify-between text-[8.5px] text-slate-400 px-1 font-semibold">
            <span>CA INTERMEDIATE SPEED REVISION</span>
            <span class="mono text-amber-400">#CrackCA</span>
          </div>
        </div>
      `;
    }

    function renderQuiz() {
      const data = curriculum[currentDayIndex];
      document.getElementById('quizDayTag').innerText = `${data.day} • ${data.subject}`;
      document.getElementById('quizQuestion').innerText = data.quiz.q;
      
      const optContainer = document.getElementById('quizOptions');
      optContainer.innerHTML = '';
      
      data.quiz.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 transition-all flex items-center justify-between";
        btn.innerHTML = `<span>${opt}</span><span class="text-[10px] mono text-slate-500">#${idx+1}</span>`;
        btn.onclick = () => selectOption(idx, data.quiz.correct, data.quiz.exp);
        optContainer.appendChild(btn);
      });

      document.getElementById('quizExplanation').innerHTML = "💡 Tap an option to verify your exam concept logic!";
    }

    function selectOption(selectedIdx, correctIdx, explanation) {
      const buttons = document.getElementById('quizOptions').querySelectorAll('button');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if(idx === correctIdx) {
          btn.className = "w-full text-left p-2.5 rounded-xl border border-emerald-500 bg-emerald-950/80 text-xs font-bold text-emerald-300 flex items-center justify-between";
        } else if(idx === selectedIdx) {
          btn.className = "w-full text-left p-2.5 rounded-xl border border-red-500 bg-red-950/80 text-xs font-bold text-red-300 flex items-center justify-between";
        }
      });

      document.getElementById('quizExplanation').innerHTML = `
        <span class="font-bold ${selectedIdx === correctIdx ? 'text-emerald-400' : 'text-amber-400'}">
          ${selectedIdx === correctIdx ? '✅ Correct Answer!' : '❌ Incorrect!'}
        </span>
        <p class="mt-1">${explanation}</p>
      `;
    }

    function switchView(mode) {
      activeView = mode;
      const statusBtn = document.getElementById('btn-status');
      const quizBtn = document.getElementById('btn-quiz');
      const statusCard = document.getElementById('statusContainer');
      const quizCard = document.getElementById('quizContainer');

      if(mode === 'status') {
        statusBtn.className = "px-2.5 py-1 text-[11px] font-bold rounded-lg bg-indigo-600 text-white transition-all";
        quizBtn.className = "px-2.5 py-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition-all";
        statusCard.classList.remove('hidden');
        statusCard.classList.add('flex');
        quizCard.classList.add('hidden');
        quizCard.classList.remove('flex');
      } else {
        quizBtn.className = "px-2.5 py-1 text-[11px] font-bold rounded-lg bg-indigo-600 text-white transition-all";
        statusBtn.className = "px-2.5 py-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition-all";
        quizCard.classList.remove('hidden');
        quizCard.classList.add('flex');
        statusCard.classList.add('hidden');
        statusCard.classList.remove('flex');
      }
    }

    function downloadStatusPNG() {
      const card = document.getElementById('statusContainer');
      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `CA_Inter_${curriculum[currentDayIndex].day.replace(' ', '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function copyCaption() {
      const d = curriculum[currentDayIndex];
      const text = `⚖️ CA INTER REVISION [${d.day}] • ${d.subject}\n🔥 TOPIC: ${d.badge}\n\n📌 KEY CONCEPTS:\n${d.col1Title}: ${d.col1Sub}\n${d.col2Title}: ${d.col2Sub}\n\n⚠️ ICAI TRAP: ${d.icaiTrap}\n\n⚡ MEMORY HACK: ${d.examHack}\n\n#CAInter #ICAI #RevisionHub`;
      
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('captionBtnText');
        btn.innerText = "Copied! ✅";
        setTimeout(() => { btn.innerText = "Copy Caption"; }, 2000);
      });
    }

    // Initialize first day
    setDay(0);
  </script>
</body>
</html>
