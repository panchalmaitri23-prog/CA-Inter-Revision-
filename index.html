<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhity</title>
  <meta name="description" content="Dhity - ICAI Revision Intelligence, Case Study Arena, Mistake Vault & Pomodoro Engine" />

  <!-- React 18 & Babel Standalone (Bina kisi install ke seedha browser me React chalane ke liye) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --panel2: #1f2937;
      --line: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --violet: #8b7cff;
      --cyan: #4de1d0;
      --green: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(17, 24, 39, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- INITIAL DATA & ICAI CASE STUDIES ---
    const INITIAL_CASES = [
      {
        id: 'case-as16',
        tag: 'AS 16',
        topic: 'Borrowing Costs',
        title: 'Qualifying Asset, Suspension Window & Capitalisation',
        facts: 'Nova Infrastructure Ltd. obtained a specific loan of ₹50,00,000 at 12% p.a. on 1st April 2025 for constructing a manufacturing plant. Active construction was halted for 3 months due to an abnormal labour strike. Surplus loan funds yielded ₹65,000 in temporary treasury bills.',
        question: 'Compute borrowing cost to be capitalised and amount charged to P&L under AS 16.',
        maxMarks: 5,
        steps: [
          { id: 's1', label: 'Provision Citation (AS 16 para 17 Abnormal Delay Suspension)', marks: 1, ref: 'AS 16 para 17' },
          { id: 's2', label: 'Exclusion of 3-Month Strike Interest (₹1,50,000 to P&L)', marks: 2, ref: 'Working Note 1' },
          { id: 's3', label: 'Temporary Reinvestment Income Netting (₹65,000 Deduction)', marks: 1, ref: 'AS 16 para 10' },
          { id: 's4', label: 'Final Capitalised Cost to Plant Asset (₹3,85,000)', marks: 1, ref: 'Balance Sheet Schedule' }
        ],
        solution: 'Under AS 16, interest during the 3-month abnormal strike (₹1,50,000) must be expensed in Profit & Loss. Net borrowing cost capitalised to plant is ₹4,50,000 - ₹65,000 = ₹3,85,000.',
        trap: 'Students often capitalise full 12 months without strike deduction or miss crediting temporary treasury income.'
      },
      {
        id: 'case-as10',
        tag: 'AS 10',
        topic: 'Property, Plant & Equipment',
        title: 'Trial-Run Output Netting & Decommissioning Provision',
        facts: 'Apex Power Ltd. imported a heavy turbine for ₹80,00,000 (Customs ₹8,00,000; GST with ITC ₹14,40,000). Installation cost ₹4,50,000. Testing cost ₹3,20,000; sample proceeds ₹1,80,000. PV of decommissioning obligation is ₹12,00,000.',
        question: 'Determine the initial carrying amount of the turbine to be capitalised under AS 10 (Revised).',
        maxMarks: 5,
        steps: [
          { id: 's1', label: 'Exclusion of Refundable Taxes (GST Input Credit)', marks: 1, ref: 'AS 10.16(a)' },
          { id: 's2', label: 'Net Test-Run Cost Capitalisation (₹1,40,000)', marks: 2, ref: 'AS 10.18(e)' },
          { id: 's3', label: 'Inclusion of PV of Decommissioning Obligation (₹12,00,000)', marks: 1, ref: 'AS 10.16(c)' },
          { id: 's4', label: 'Total Initial Cost Computation (₹1,05,90,000)', marks: 1, ref: 'Asset Schedule' }
        ],
        solution: 'Total capitalised cost of Turbine under AS 10 (Revised) = ₹1,05,90,000. GST ₹14,40,000 is excluded since ITC is available. Decommissioning PV is included on day one.',
        trap: 'Capitalising GST despite ITC eligibility, or treating trial sales proceeds as P&L income.'
      },
      {
        id: 'case-sa505',
        tag: 'SA 505',
        topic: 'External Confirmations',
        title: 'Negative Confirmation Ineffectiveness & Non-Response',
        facts: 'During audit of Stellar Trade Ltd., auditor sent negative confirmation requests to 150 debtors. Only 4 responded with disputes. Auditor concluded remaining 146 accounts are correct without performing alternative testing.',
        question: 'Evaluate whether auditor complied with SA 505 & SA 330.',
        maxMarks: 4,
        steps: [
          { id: 's1', label: 'Analysis of Negative Confirmation Conditions (SA 505 Para 15)', marks: 1, ref: 'SA 505' },
          { id: 's2', label: 'Persuasive Evidence Standard (Negative gives less audit evidence)', marks: 1, ref: 'SA 330 / SA 505' },
          { id: 's3', label: 'Mandatory Alternative Audit Procedures (Subsequent clearance testing)', marks: 2, ref: 'SA 505 Para 12' }
        ],
        solution: 'Auditor’s conclusion is flawed. Negative confirmations provide substantially less persuasive audit evidence. Unless all four stringent conditions of SA 505 are strictly satisfied, alternative testing on non-responses is mandatory.',
        trap: 'Assuming no reply means 100% agreement by debtor without evaluating risk profile.'
      }
    ];

    const INITIAL_TOPICS = [
      { id: '1', code: 'AS 16', name: 'Borrowing Costs', priority: 'High', stability: 78, decayHours: 18, lastRevised: 'Yesterday', trapTaxonomy: 'Abnormal delay interest expensing' },
      { id: '2', code: 'AS 10', name: 'PPE & Restoration Asset', priority: 'Critical', stability: 44, decayHours: 6, lastRevised: '4 days ago', trapTaxonomy: 'Netting test-run proceeds' },
      { id: '3', code: 'SA 505', name: 'External Confirmations', priority: 'Medium', stability: 82, decayHours: 32, lastRevised: '2 days ago', trapTaxonomy: 'Negative confirmation validity' },
      { id: '4', code: 'AS 22', name: 'Taxes on Income (DTA/DTL)', priority: 'Critical', stability: 38, decayHours: 4, lastRevised: '5 days ago', trapTaxonomy: 'Virtual certainty vs reasonable certainty' },
      { id: '5', code: 'SA 240', name: 'Auditor Responsibility for Fraud', priority: 'High', stability: 65, decayHours: 14, lastRevised: 'Today', trapTaxonomy: 'Management override of controls' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('command-center');
      const [topics, setTopics] = useState(INITIAL_TOPICS);
      const [cases, setCases] = useState(INITIAL_CASES);
      const [activeCaseIdx, setActiveCaseIdx] = useState(0);
      const [checkedSteps, setCheckedSteps] = useState({});
      const [showSolution, setShowSolution] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // --- MISTAKE VAULT STATE ---
      const [mistakes, setMistakes] = useState(() => {
        const saved = localStorage.getItem('dhity_mistakes_vault');
        return saved ? JSON.parse(saved) : [
          { id: 1, code: 'AS 16', title: 'Abnormal Strike Period Capitalised', tag: 'Concept Trap', notes: 'Forgot that abnormal stoppage cannot be capitalised under para 17.', date: 'Today' },
          { id: 2, code: 'AS 10', title: 'Test-Run Scrap Proceeds in P&L', tag: 'ICAI Format Slip', notes: 'Deducted directly from PPE cost instead of credit to P&L.', date: 'Yesterday' }
        ];
      });
      const [isMistakeModalOpen, setIsMistakeModalOpen] = useState(false);
      const [selectedMistakeTag, setSelectedMistakeTag] = useState('Omitted Provision Citation');
      const [mistakeNoteInput, setMistakeNoteInput] = useState('');

      useEffect(() => {
        localStorage.setItem('dhity_mistakes_vault', JSON.stringify(mistakes));
      }, [mistakes]);

      // --- GLOBAL POMODORO TIMER STATE ---
      const [pomoSettings, setPomoSettings] = useState(() => {
        const saved = localStorage.getItem('dhity_pomodoro_cfg');
        return saved ? JSON.parse(saved) : { work: 25, rest: 5 };
      });
      const [pomoMode, setPomoMode] = useState('work'); // 'work' | 'rest'
      const [pomoSeconds, setPomoSeconds] = useState(25 * 60);
      const [isPomoRunning, setIsPomoRunning] = useState(false);
      const [isPomoSettingsOpen, setIsPomoSettingsOpen] = useState(false);
      const [tempWork, setTempWork] = useState(pomoSettings.work);
      const [tempRest, setTempRest] = useState(pomoSettings.rest);

      // Pomodoro Runner
      useEffect(() => {
        let interval = null;
        if (isPomoRunning) {
          interval = setInterval(() => {
            setPomoSeconds((prev) => {
              if (prev <= 1) {
                if (pomoMode === 'work') {
                  triggerConfetti();
                  showToast('🎉 Focus block completed! Take a 5m breather.');
                  setPomoMode('rest');
                  return pomoSettings.rest * 60;
                } else {
                  showToast('🔔 Break over! Ready for next focus block.');
                  setPomoMode('work');
                  return pomoSettings.work * 60;
                }
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isPomoRunning, pomoMode, pomoSettings]);

      const formatPomoTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const triggerConfetti = () => {
        if (window.confetti) window.confetti({ particleCount: 75, spread: 65 });
      };

      // Case Study Calculations
      const activeCase = cases[activeCaseIdx];
      const currentScore = useMemo(() => {
        let sc = 0;
        activeCase.steps.forEach(st => {
          if (checkedSteps[st.id]) sc += st.marks;
        });
        return sc;
      }, [checkedSteps, activeCase]);

      const toggleStep = (id) => {
        setCheckedSteps(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleClaimFullMarks = () => {
        const full = {};
        activeCase.steps.forEach(st => full[st.id] = true);
        setCheckedSteps(full);
        triggerConfetti();
        showToast('🎯 Perfect 5/5 Step Marking Achieved!');
      };

      const logMistakeInVault = () => {
        if (!mistakeNoteInput.trim()) {
          showToast('Please enter an observation note');
          return;
        }
        const newEntry = {
          id: Date.now(),
          code: activeCase.tag,
          title: activeCase.title,
          tag: selectedMistakeTag,
          notes: mistakeNoteInput,
          date: 'Just now'
        };
        setMistakes([newEntry, ...mistakes]);
        setIsMistakeModalOpen(false);
        setMistakeNoteInput('');
        showToast('⚠️ Mistake logged in diagnostic vault');
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#0b0f19] text-[#f9fafb]">
          
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#1f2937] border border-[#8b7cff] text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2 text-xs font-semibold animate-bounce">
              <span>⚡</span> {toastMsg}
            </div>
          )}

          {/* TOP GLOBAL BAR */}
          <header className="sticky top-0 z-40 bg-[#111827]/95 backdrop-blur-md border-b border-[#374151] px-4 lg:px-8 py-3.5">
            <div className="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-4">
              
              {/* Brand Lockup */}
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => setActiveTab('command-center')}
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#8b7cff] to-[#4de1d0] grid place-items-center font-black text-xl text-white shadow-lg shadow-[#8b7cff]/20 group-hover:scale-105 transition-transform">
                  D
                </div>
                <div>
                  <h1 className="font-extrabold text-lg tracking-tight leading-none text-white">Dhity</h1>
                  <span className="text-[9px] font-mono font-bold tracking-widest text-gray-400 uppercase mt-1 block">INTELLIGENCE</span>
                </div>
              </div>

              {/* NAVIGATION TABS */}
              <nav className="flex items-center bg-[#1f2937] rounded-2xl p-1 border border-[#374151]">
                <button
                  onClick={() => setActiveTab('command-center')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'command-center' ? 'bg-[#111827] text-white shadow-sm' : 'text-gray-400 hover:text-white'}`}
                >
                  ◈ Command Center
                </button>
                <button
                  onClick={() => setActiveTab('case-arena')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'case-arena' ? 'bg-[#111827] text-white shadow-sm' : 'text-gray-400 hover:text-white'}`}
                >
                  ⚖ Case Arena
                </button>
                <button
                  onClick={() => setActiveTab('mistake-vault')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'mistake-vault' ? 'bg-[#111827] text-white shadow-sm' : 'text-gray-400 hover:text-white'}`}
                >
                  ◌ Mistake Vault ({mistakes.length})
                </button>
              </nav>

              {/* GLOBAL PERSISTENT POMODORO TIMER */}
              <div className="flex items-center gap-1.5 p-1 rounded-2xl border border-[#374151] bg-[#111827] shadow-sm">
                
                {/* Mode Selector */}
                <div className="flex items-center bg-[#1f2937] rounded-xl p-0.5 border border-[#374151]/50">
                  <button
                    onClick={() => { setPomoMode('work'); setIsPomoRunning(false); setPomoSeconds(pomoSettings.work * 60); }}
                    className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${pomoMode === 'work' ? 'bg-[#111827] text-white shadow-xs' : 'text-gray-400 hover:text-white'}`}
                  >
                    <span>⚡ Focus</span>
                    <span className="font-mono text-[10px] text-gray-400">({pomoSettings.work}m)</span>
                  </button>
                  <button
                    onClick={() => { setPomoMode('rest'); setIsPomoRunning(false); setPomoSeconds(pomoSettings.rest * 60); }}
                    className={`flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-bold transition-all ${pomoMode === 'rest' ? 'bg-[#111827] text-[#4de1d0] shadow-xs' : 'text-gray-400 hover:text-white'}`}
                  >
                    <span>☕ Rest</span>
                    <span className="font-mono text-[10px] text-gray-400">({pomoSettings.rest}m)</span>
                  </button>
                </div>

                {/* Live Digital Display & Progress */}
                <div className="flex flex-col items-start px-2 py-0.5 min-w-[62px]">
                  <span className="text-sm font-mono font-extrabold text-white leading-none tabular-nums tracking-tight">
                    {formatPomoTime(pomoSeconds)}
                  </span>
                  <div className="w-full h-1 bg-[#374151] rounded-full overflow-hidden mt-1">
                    <div
                      className="h-full bg-gradient-to-r from-[#8b7cff] to-[#4de1d0] transition-all duration-300"
                      style={{ width: `${Math.round((( (pomoMode === 'work' ? pomoSettings.work : pomoSettings.rest) * 60 - pomoSeconds) / ((pomoMode === 'work' ? pomoSettings.work : pomoSettings.rest) * 60)) * 100)}%` }}
                    />
                  </div>
                </div>

                {/* Play/Pause */}
                <button
                  onClick={() => setIsPomoRunning(!isPomoRunning)}
                  className={`w-7 h-7 rounded-xl flex items-center justify-center font-bold transition-all ${isPomoRunning ? 'bg-amber-500/20 text-amber-400' : 'bg-gradient-to-r from-indigo-500 to-teal-400 text-white shadow-sm'}`}
                  title={isPomoRunning ? 'Pause' : 'Start'}
                >
                  {isPomoRunning ? '⏸' : '▶'}
                </button>

                {/* Reset */}
                <button
                  onClick={() => { setIsPomoRunning(false); setPomoSeconds((pomoMode === 'work' ? pomoSettings.work : pomoSettings.rest) * 60); }}
                  className="w-7 h-7 rounded-xl text-gray-400 hover:text-white hover:bg-[#1f2937] flex items-center justify-center transition-colors"
                  title="Reset"
                >
                  ↺
                </button>

                {/* Settings Toggle */}
                <button
                  onClick={() => { setTempWork(pomoSettings.work); setTempRest(pomoSettings.rest); setIsPomoSettingsOpen(true); }}
                  className="w-7 h-7 rounded-xl text-gray-400 hover:text-white hover:bg-[#1f2937] flex items-center justify-center transition-colors"
                  title="Interval Settings"
                >
                  ⚙
                </button>
              </div>

            </div>
          </header>

          {/* VIEW: COMMAND CENTER */}
          {activeTab === 'command-center' && (
            <main className="max-w-[1400px] w-full mx-auto p-4 lg:p-8 space-y-6">
              
              {/* Hero Banner */}
              <div className="bg-[#111827] border border-[#374151] rounded-3xl p-6 lg:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-xl">
                <div>
                  <div className="flex items-center gap-2 text-xs font-mono text-[#8b7cff] font-bold mb-2">
                    <span>◈ ICAI EXAM SURVIVAL ENGINE</span>
                    <span>•</span>
                    <span className="text-emerald-400">Target: 70+ in Paper 1 & 5</span>
                  </div>
                  <h2 className="text-2xl lg:text-3xl font-black text-white tracking-tight">
                    Active Recall & Step-Marking Hub
                  </h2>
                  <p className="text-sm text-gray-400 max-w-2xl mt-1">
                    Practice structured questions with official ICAI marking guidelines, track recall decay intervals, and catalog red-ink exam traps.
                  </p>
                </div>
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setActiveTab('case-arena')}
                    className="px-5 py-3 rounded-2xl bg-gradient-to-r from-indigo-500 to-teal-400 text-white font-bold text-xs hover:brightness-110 shadow-lg shadow-indigo-500/25 transition-all"
                  >
                    ⚖ Launch Case Arena
                  </button>
                </div>
              </div>

              {/* Priority Topic Queue Grid */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div className="bg-[#111827] border border-[#374151] rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center text-xs font-bold text-gray-400">
                    <span>CRITICAL DECAY QUEUE</span>
                    <span className="text-rose-400 font-mono">Retest &lt; 24h</span>
                  </div>
                  <div className="space-y-2">
                    {topics.filter(t => t.stability < 60).map(t => (
                      <div key={t.id} className="p-3 rounded-2xl bg-[#1f2937] border border-[#374151] flex justify-between items-center">
                        <div>
                          <div className="text-xs font-bold text-white">{t.code}: {t.name}</div>
                          <div className="text-[10px] text-rose-400 font-mono">Decays in {t.decayHours}h • Trap: {t.trapTaxonomy}</div>
                        </div>
                        <span className="text-xs font-mono font-bold text-rose-400">{t.stability}%</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-[#111827] border border-[#374151] rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center text-xs font-bold text-gray-400">
                    <span>MISTAKE VAULT METRICS</span>
                    <span className="text-amber-400 font-mono">{mistakes.length} Flags</span>
                  </div>
                  <div className="space-y-2">
                    {mistakes.slice(0, 3).map(m => (
                      <div key={m.id} className="p-3 rounded-2xl bg-[#1f2937] border border-[#374151]">
                        <div className="flex justify-between text-[11px] font-bold">
                          <span className="text-indigo-400">{m.code}</span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400">{m.tag}</span>
                        </div>
                        <div className="text-xs text-white truncate mt-1">{m.title}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-[#111827] border border-[#374151] rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center text-xs font-bold text-gray-400">
                    <span>ACTIVE STUDY METRICS</span>
                    <span className="text-emerald-400 font-mono">Phase 2 Target</span>
                  </div>
                  <div className="space-y-3 pt-2">
                    <div>
                      <div className="flex justify-between text-xs text-gray-300 mb-1">
                        <span>Syllabus Recalled</span>
                        <span className="font-mono font-bold text-white">68%</span>
                      </div>
                      <div className="h-2 bg-[#1f2937] rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-[#8b7cff] to-[#4de1d0] w-[68%]" />
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between text-xs text-gray-300 mb-1">
                        <span>ICAI Working Notes Mastery</span>
                        <span className="font-mono font-bold text-emerald-400">82%</span>
                      </div>
                      <div className="h-2 bg-[#1f2937] rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-500 w-[82%]" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </main>
          )}

          {/* VIEW: CASE STUDY ARENA */}
          {activeTab === 'case-arena' && (
            <main className="max-w-[1400px] w-full mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-[1.45fr_0.95fr] gap-6 items-start">
              
              {/* Left Pane: Interactive Case Study & Matrix */}
              <section className="bg-[#111827] border border-[#374151] rounded-3xl p-6 lg:p-8 space-y-6 shadow-xl">
                
                {/* Case Scenario Selector & Live Score */}
                <div className="flex flex-wrap items-center justify-between pb-4 border-b border-[#374151] gap-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                      {activeCase.tag}
                    </span>
                    <select
                      value={activeCaseIdx}
                      onChange={(e) => { setActiveCaseIdx(Number(e.target.value)); setCheckedSteps({}); setShowSolution(false); }}
                      className="bg-[#1f2937] border border-[#374151] rounded-xl px-3 py-1.5 text-xs text-white font-bold focus:outline-none focus:border-[#8b7cff]"
                    >
                      {cases.map((c, i) => (
                        <option key={c.id} value={i}>{c.tag}: {c.topic}</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="text-xs text-gray-400 font-mono">ICAI Score:</span>
                    <div className="px-3.5 py-1.5 rounded-xl bg-[#1f2937] border border-[#374151] font-mono font-bold text-sm">
                      <span className="text-emerald-400">{currentScore}</span>
                      <span className="text-gray-400"> / {activeCase.maxMarks} Marks</span>
                    </div>
                  </div>
                </div>

                {/* Case Facts Card */}
                <div className="space-y-3">
                  <h2 className="text-xl font-black text-white tracking-tight leading-snug">
                    {activeCase.title}
                  </h2>
                  <div className="p-5 rounded-2xl bg-[#1f2937]/70 border border-[#374151] text-xs leading-relaxed text-gray-200 space-y-3">
                    <p>{activeCase.facts}</p>
                    <div className="pt-2 border-t border-[#374151] font-semibold text-[#8b7cff]">
                      {activeCase.question}
                    </div>
                  </div>
                </div>

                {/* ICAI Step-Marking Matrix */}
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-bold text-gray-300 uppercase tracking-wider">
                      ICAI Working Notes & Marking Steps
                    </h3>
                    <span className="text-[11px] text-gray-400 font-mono">Click to evaluate your working</span>
                  </div>

                  <div className="space-y-2.5">
                    {activeCase.steps.map(step => (
                      <div
                        key={step.id}
                        onClick={() => toggleStep(step.id)}
                        className={`p-3.5 rounded-2xl border cursor-pointer flex justify-between items-center transition-all ${checkedSteps[step.id] ? 'border-emerald-500/70 bg-emerald-950/20' : 'border-[#374151] bg-[#1f2937] hover:border-[#8b7cff]/40'}`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-base">{checkedSteps[step.id] ? '✅' : '⬜'}</span>
                          <div>
                            <span className="text-xs font-bold text-white block leading-snug">{step.label}</span>
                            <span className="text-[10px] font-mono text-[#4de1d0]">Ref: {step.ref}</span>
                          </div>
                        </div>
                        <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-[#111827] border border-[#374151] text-gray-300">
                          +{step.marks}M
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Arena Actions */}
                <div className="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-[#374151]">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setShowSolution(!showSolution)}
                      className="px-4 py-2 rounded-xl bg-[#1f2937] hover:bg-[#374151] border border-[#374151] text-xs font-semibold text-white transition-all"
                    >
                      📖 {showSolution ? 'Hide Model Answer' : 'View Model Answer'}
                    </button>
                    <button
                      onClick={() => setCheckedSteps({})}
                      className="p-2 rounded-xl bg-[#1f2937] hover:bg-[#374151] border border-[#374151] text-gray-400 hover:text-white transition-all"
                      title="Reset Steps"
                    >
                      ↺
                    </button>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setIsMistakeModalOpen(true)}
                      className="px-3.5 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 text-xs font-bold transition-all"
                    >
                      ⚠️ Flag Mistake
                    </button>
                    <button
                      onClick={handleClaimFullMarks}
                      className="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-teal-400 text-white text-xs font-bold hover:brightness-110 shadow-md transition-all"
                    >
                      ✨ Full Marks Check
                    </button>
                  </div>
                </div>

                {/* Model Answer Drawer */}
                {showSolution && (
                  <div className="p-4 rounded-2xl bg-[#1f2937] border border-indigo-500/40 space-y-2">
                    <div className="text-xs font-mono font-bold text-emerald-400">OFFICIAL ICAI SUGGESTED SOLUTION</div>
                    <p className="text-xs text-gray-200 leading-relaxed">{activeCase.solution}</p>
                    <div className="pt-2 border-t border-[#374151] text-[11px] text-rose-400 font-mono">
                      Examiner Trap Watch: {activeCase.trap}
                    </div>
                  </div>
                )}

              </section>

              {/* Right Pane: Mistake Vault Summary */}
              <aside className="space-y-5">
                <div className="bg-[#111827] border border-[#374151] rounded-3xl p-5 shadow-lg space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-bold text-white">Diagnostic Error Ledger</h3>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-[#1f2937] text-gray-400">Recent</span>
                  </div>

                  <div className="space-y-2.5 max-h-[460px] overflow-y-auto">
                    {mistakes.map(m => (
                      <div key={m.id} className="p-3.5 rounded-2xl bg-[#1f2937] border border-[#374151] space-y-1">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-mono font-bold text-indigo-400">{m.code}</span>
                          <span className="text-[10px] text-gray-400">{m.date}</span>
                        </div>
                        <div className="font-bold text-white text-xs">{m.title}</div>
                        <span className="inline-block px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 text-[10px] font-mono font-bold">
                          {m.tag}
                        </span>
                        <p className="text-[11px] text-gray-400 italic">"{m.notes}"</p>
                      </div>
                    ))}
                  </div>
                </div>
              </aside>

            </main>
          )}

          {/* VIEW: MISTAKE VAULT FULL */}
          {activeTab === 'mistake-vault' && (
            <main className="max-w-[1400px] w-full mx-auto p-4 lg:p-8 space-y-6">
              <div className="flex justify-between items-center">
                <div>
                  <h2 className="text-2xl font-black text-white">Red-Ink Mistake Vault</h2>
                  <p className="text-xs text-gray-400">Classified taxonomy of personal exam slips and provision misquotations.</p>
                </div>
                <button
                  onClick={() => setIsMistakeModalOpen(true)}
                  className="px-4 py-2 rounded-xl bg-gradient-to-r from-rose-500 to-amber-500 text-white text-xs font-bold"
                >
                  + Add Custom Mistake
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {mistakes.map(m => (
                  <div key={m.id} className="p-4 rounded-3xl bg-[#111827] border border-[#374151] space-y-2 shadow-md">
                    <div className="flex justify-between items-center">
                      <span className="font-mono font-bold text-indigo-400 text-xs">{m.code}</span>
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 font-mono font-bold">{m.tag}</span>
                    </div>
                    <h3 className="font-bold text-sm text-white">{m.title}</h3>
                    <p className="text-xs text-gray-400 leading-relaxed italic">"{m.notes}"</p>
                    <div className="pt-2 border-t border-[#374151] flex justify-between text-[10px] text-gray-500 font-mono">
                      <span>Logged: {m.date}</span>
                      <button
                        onClick={() => setMistakes(mistakes.filter(x => x.id !== m.id))}
                        className="text-rose-400 hover:underline"
                      >
                        Resolve / Archive
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* MODAL: POMODORO INTERVAL SETTINGS */}
          {isPomoSettingsOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#111827] border border-[#374151] rounded-3xl p-6 text-white shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-[#374151]">
                  <b className="text-sm font-bold">Pomodoro Interval Settings</b>
                  <button onClick={() => setIsPomoSettingsOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-gray-400">Focus Block (Work)</span>
                      <span className="font-mono text-[#8b7cff] font-bold">{tempWork} mins</span>
                    </div>
                    <input
                      type="range" min="5" max="90" step="5" value={tempWork}
                      onChange={(e) => setTempWork(Number(e.target.value))}
                      className="w-full accent-[#8b7cff]"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-gray-400">Short Rest (Break)</span>
                      <span className="font-mono text-[#4de1d0] font-bold">{tempRest} mins</span>
                    </div>
                    <input
                      type="range" min="1" max="30" step="1" value={tempRest}
                      onChange={(e) => setTempRest(Number(e.target.value))}
                      className="w-full accent-[#4de1d0]"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsPomoSettingsOpen(false)} className="px-3 py-1.5 rounded-xl border border-[#374151] text-xs text-gray-400">Cancel</button>
                  <button
                    onClick={() => {
                      const cfg = { work: tempWork, rest: tempRest };
                      setPomoSettings(cfg);
                      localStorage.setItem('dhity_pomodoro_cfg', JSON.stringify(cfg));
                      setPomoSeconds(cfg.work * 60);
                      setIsPomoSettingsOpen(false);
                      showToast('Pomodoro intervals saved');
                    }}
                    className="px-4 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500 to-teal-400 text-white text-xs font-bold"
                  >
                    Save & Apply
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: FLAG MISTAKE */}
          {isMistakeModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#111827] border border-[#374151] rounded-3xl p-6 text-white shadow-2xl space-y-4">
                <h4 className="text-base font-bold text-rose-400 flex items-center gap-2">
                  ⚠️ Log Root-Cause to Mistake Vault
                </h4>
                <p className="text-xs text-gray-400">Select the examiner trap that caused this slip:</p>

                <div className="space-y-2">
                  {[
                    'Omitted Provision Citation',
                    'ICAI Distinction / Concept Trap',
                    'Arithmetic / Clerical Slip',
                    'Working Note Missing'
                  ].map(tg => (
                    <button
                      key={tg}
                      onClick={() => setSelectedMistakeTag(tg)}
                      className={`w-full text-left p-3 rounded-xl border text-xs transition-all ${selectedMistakeTag === tg ? 'border-indigo-500 bg-indigo-950/40 text-white' : 'border-[#374151] bg-[#1f2937] text-gray-300'}`}
                    >
                      • {tg}
                    </button>
                  ))}
                </div>

                <textarea
                  value={mistakeNoteInput}
                  onChange={(e) => setMistakeNoteInput(e.target.value)}
                  placeholder="Personal reflection or formula that was overlooked..."
                  className="w-full bg-[#1f2937] border border-[#374151] rounded-xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 h-20 resize-none"
                />

                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsMistakeModalOpen(false)} className="px-4 py-2 rounded-xl border border-[#374151] text-xs text-gray-400">Cancel</button>
                  <button onClick={logMistakeInVault} className="px-4 py-2 rounded-xl bg-gradient-to-r from-rose-500 to-amber-500 text-white text-xs font-bold">Record in Vault</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
