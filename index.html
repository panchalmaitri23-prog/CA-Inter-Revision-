<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CA Inter Daily Revision Station</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #060814;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Ultra Modern Glass Effect */
    .glass-surface {
      background: rgba(18, 24, 43, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-pill {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 9:16 WhatsApp Status Exact Canvas */
    .status-frame {
      width: 100%;
      max-width: 365px;
      height: 650px;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95), 0 0 40px rgba(99, 102, 241, 0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Story Progress Bar */
    .story-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    .story-progress {
      height: 100%;
      background: #ffffff;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen pb-24 pt-4 px-3 flex flex-col items-center justify-start bg-gradient-to-b from-[#060814] via-[#090e21] to-[#04060d]">

  <!-- Top App Navigation Bar -->
  <div class="w-full max-w-md flex items-center justify-between px-3 py-2.5 rounded-2xl glass-surface mb-3">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-400 via-orange-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-graduation-cap text-white text-sm"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-xs font-black tracking-tight text-white uppercase">CA Inter Pulse</h1>
          <span class="text-[8.5px] px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">NEW SYLLABUS</span>
        </div>
        <p class="text-[9.5px] text-slate-400 font-medium">Daily Exam Bite & Status Engine</p>
      </div>
    </div>

    <!-- Streak Badge -->
    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400">
      <i class="fa-solid fa-fire text-xs animate-bounce"></i>
      <span class="text-[10px] font-black tracking-wider">DAY 01</span>
    </div>
  </div>

  <!-- Subject Filter Pills -->
  <div class="w-full max-w-md flex gap-2 overflow-x-auto no-scrollbar py-1 mb-2 px-1">
    <button onclick="filterSubject('all')" id="tab-all" class="sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all bg-indigo-600 text-white shadow-md">All (8 Days)</button>
    <button onclick="filterSubject('ACC')" id="tab-acc" class="sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all glass-pill text-slate-300">Accounting</button>
    <button onclick="filterSubject('LAW')" id="tab-law" class="sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all glass-pill text-slate-300">Corp Law</button>
    <button onclick="filterSubject('GST')" id="tab-gst" class="sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all glass-pill text-slate-300">GST</button>
    <button onclick="filterSubject('TAX')" id="tab-tax" class="sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all glass-pill text-slate-300">Income Tax</button>
  </div>

  <!-- Horizontal Story Day Slider -->
  <div class="w-full max-w-md overflow-x-auto no-scrollbar flex gap-2 pb-2 px-1" id="dayPillList">
    <!-- Injected via JS -->
  </div>

  <!-- Action Floating Toolbar -->
  <div class="w-full max-w-md flex items-center gap-2 my-2 px-1">
    <button onclick="downloadPoster()" class="flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 text-slate-950 font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-xl shadow-amber-500/25 active:scale-95 transition-all">
      <i class="fa-solid fa-download text-sm"></i>
      Save WhatsApp Status (HD)
    </button>
    <button onclick="copyCaption()" class="py-3 px-4 rounded-2xl glass-surface hover:bg-white/10 text-white font-bold text-xs flex items-center gap-2 border border-white/15 active:scale-95 transition-all">
      <i class="fa-regular fa-copy text-amber-400"></i>
      <span id="copyBtnText">Caption</span>
    </button>
    <button onclick="toggleCardMode()" id="modeToggleBtn" class="py-3 px-3.5 rounded-2xl glass-surface text-cyan-400 font-bold text-xs flex items-center gap-1.5 border border-white/15 active:scale-95 transition-all">
      <i class="fa-solid fa-brain"></i>
    </button>
  </div>

  <!-- WhatsApp Status Canvas (9:16 Display) -->
  <div id="statusCanvas" class="status-frame flex flex-col justify-between p-5 border text-white transition-all duration-300">
    <!-- Dynamic Injected Canvas -->
  </div>

  <!-- Bottom App Tab Bar -->
  <div class="fixed bottom-3 inset-x-4 max-w-md mx-auto h-14 rounded-2xl glass-surface border border-white/10 flex items-center justify-around px-3 z-50 shadow-2xl">
    <button onclick="prevDay()" class="flex flex-col items-center text-slate-400 hover:text-white active:scale-90 transition-all">
      <i class="fa-solid fa-chevron-left text-xs mb-0.5"></i>
      <span class="text-[9px] font-bold">Previous</span>
    </button>
    
    <div class="w-px h-6 bg-white/10"></div>
    
    <button onclick="showQuickGuide()" class="flex flex-col items-center text-amber-400 active:scale-90 transition-all">
      <i class="fa-solid fa-lightbulb text-sm mb-0.5"></i>
      <span class="text-[9px] font-black">ICAI Hack</span>
    </button>
    
    <div class="w-px h-6 bg-white/10"></div>

    <button onclick="nextDay()" class="flex flex-col items-center text-slate-400 hover:text-white active:scale-90 transition-all">
      <i class="fa-solid fa-chevron-right text-xs mb-0.5"></i>
      <span class="text-[9px] font-bold">Next Day</span>
    </button>
  </div>

  <script>
    const curriculum = [
      {

        icon: "fa-scale-balanced",

        col1: {

      {

        col1: {

        hack: "Constructive Notice safeguards the Company; Indoor Management (Turquand Rule) safeguards the Outsider.",
        quiz: {
          q: "Royal British Bank v. Turquand protects which party?",
          opts: ["Company against directors", "Third parties dealing in good faith", "Registrar of Companies", "Minority shareholders"],

      },
      {

        quiz: {
          q: "Can a registered entity adjust accumulated ITC against RCM liability payable to Government?",
          opts: ["Yes, fully allowed", "Only up to 50%", "Strictly prohibited - Cash only", "Allowed after Commissioner approval"],

      },
      {
        id: 6,
        day: "Day 07",
        subjectTag: "TAX",
        subject: "INCOME TAX",
        topicTitle: "PY, AY & 5 HEADS",
        subtitle: "Total Income Computation Flow",
        icon: "fa-calculator",
        themeGradient: "radial-gradient(circle at 10% 10%, #330d3f 0%, #110316 100%)",
        accent: "#c084fc",
        border: "rgba(192, 132, 252, 0.35)",
        col1: {
          badge: "TAX YEAR DUALITY",
          title: "PY vs AY Mechanism",
          items: ["• Previous Year (PY): Year in which income is earned", "• Assessment Year (AY): Immediately following tax year", "• Sec 174: Non-residents leaving India taxed in same PY"]
        },
        col2: {
          badge: "TOTAL INCOME",
          title: "5 Computation Heads",
          items: ["• 1. Salary  2. House Property  3. PGBP", "• 4. Capital Gains  5. Other Sources (IFOS)", "• GTI (-) Chapter VI-A Deductions = Total Income"]
        },
        trap: "Tax is NEVER calculated on Gross Total Income (GTI). It is calculated on Total Income rounded to nearest ₹10 u/s 288A!",

          opts: ["Section 288A", "Section 288B", "Section 139(1)", "Section 80C"],

        col1: {

          items: ["• Resident Individuals ONLY (NR not eligible)", "• Old Regime: Income ≤ ₹5L ➔ Max ₹12,500", "• New Regime (115BAC): Income ≤ ₹7L ➔ Max ₹25,000"]
        },
        col2: {
          badge: "SURCHARGE & CESS",

          q: "What is the Cess percentage charged on aggregate income tax and surcharge?",

    ];

    let currentDayIndex = 0;
    let isQuizMode = false;
    let currentFilter = 'all';

    function init() {
      renderDayPills();
      renderStatusCard();
    }

    function renderDayPills() {
      const container = document.getElementById('dayPillList');
      container.innerHTML = '';
      
      const filtered = currentFilter === 'all' 
        ? curriculum 
        : curriculum.filter(c => c.subjectTag === currentFilter);

      filtered.forEach((item) => {
        const isActive = item.id === currentDayIndex;
        const btn = document.createElement('button');
        btn.onclick = () => selectDay(item.id);
        btn.className = `flex-shrink-0 px-3 py-2 rounded-2xl transition-all flex flex-col items-center ${
          isActive 
            ? 'glass-surface border-2 shadow-lg scale-105' 
            : 'glass-pill opacity-70 hover:opacity-100'
        }`;
        btn.style.borderColor = isActive ? item.accent : 'rgba(255,255,255,0.08)';
        
        btn.innerHTML = `
          <div class="flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${item.accent}"></span>
            <span class="text-[9px] mono font-bold" style="color: ${item.accent}">${item.day}</span>
          </div>
          <span class="text-[11px] font-black mt-0.5 ${isActive ? 'text-white' : 'text-slate-300'}">${item.subjectTag}: ${item.topicTitle.split(' ')[0]}</span>
        `;
        container.appendChild(btn);
      });
    }

    function selectDay(id) {
      currentDayIndex = id;
      isQuizMode = false;
      renderDayPills();
      renderStatusCard();
    }

    function prevDay() {
      currentDayIndex = (currentDayIndex - 1 + curriculum.length) % curriculum.length;
      selectDay(currentDayIndex);
    }

    function nextDay() {
      currentDayIndex = (currentDayIndex + 1) % curriculum.length;
      selectDay(currentDayIndex);
    }

    function filterSubject(tag) {
      currentFilter = tag;
      document.querySelectorAll('.sub-filter').forEach(b => {
        b.className = "sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all glass-pill text-slate-300";
      });
      document.getElementById(`tab-${tag.toLowerCase()}`).className = "sub-filter px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all bg-indigo-600 text-white shadow-md";
      
      const first = tag === 'all' ? curriculum[0] : curriculum.find(c => c.subjectTag === tag);
      if(first) selectDay(first.id);
    }

    function toggleCardMode() {
      isQuizMode = !isQuizMode;
      const btn = document.getElementById('modeToggleBtn');
      if(isQuizMode) {
        btn.className = "py-3 px-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-xs flex items-center gap-1.5 shadow-lg active:scale-95 transition-all";
        renderQuizCard();
      } else {
        btn.className = "py-3 px-3.5 rounded-2xl glass-surface text-cyan-400 font-bold text-xs flex items-center gap-1.5 border border-white/15 active:scale-95 transition-all";
        renderStatusCard();
      }
    }

    function renderStatusCard() {
      const data = curriculum[currentDayIndex];
      const card = document.getElementById('statusCanvas');
      card.style.background = data.themeGradient;
      card.style.borderColor = data.border;

      // Calculate progress percentage for top story bar
      const progressPercent = ((data.id + 1) / curriculum.length) * 100;

      card.innerHTML = `
        <!-- Story Top Indicators -->
        <div>
          <div class="story-bar w-full mb-3">
            <div class="story-progress" style="width: ${progressPercent}%; background: ${data.accent}"></div>
          </div>

          <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded-lg glass-pill flex items-center justify-center text-xs" style="color: ${data.accent}">
                <i class="fa-solid ${data.icon}"></i>
              </div>
              <span class="text-[10px] font-black tracking-wider uppercase px-2 py-0.5 rounded-md glass-pill" style="color: ${data.accent}; border-color: ${data.border}">
                ${data.day} • ${data.subject}
              </span>
            </div>
            <span class="text-[9px] mono font-bold text-slate-400 tracking-widest uppercase">ICAI MODULE FOCUS</span>
          </div>

          <div class="mt-2.5">
            <span class="text-[9.5px] font-black uppercase tracking-widest text-amber-300">Foundation Revision</span>
            <h2 class="text-base font-black text-white leading-tight mt-0.5">${data.topicTitle}</h2>
            <p class="text-[10px] text-slate-300 font-semibold">${data.subtitle}</p>
          </div>
        </div>

        <!-- High-Contrast 2-Column Modules -->
        <div class="space-y-2 my-auto">
          <!-- Module 1 -->
          <div class="p-3 rounded-2xl glass-surface border border-white/10">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-xs font-black text-amber-300">${data.col1.title}</h4>
              <span class="text-[8.5px] mono font-extrabold px-1.5 py-0.5 rounded bg-white/10 text-slate-200">${data.col1.badge}</span>
            </div>
            <div class="space-y-0.5">
              ${data.col1.items.map(i => `<p class="text-[10px] text-slate-200 font-medium leading-tight">${i}</p>`).join('')}
            </div>
          </div>

          <!-- Module 2 -->
          <div class="p-3 rounded-2xl glass-surface border border-white/10">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-xs font-black text-cyan-300">${data.col2.title}</h4>
              <span class="text-[8.5px] mono font-extrabold px-1.5 py-0.5 rounded bg-white/10 text-slate-200">${data.col2.badge}</span>
            </div>
            <div class="space-y-0.5">
              ${data.col2.items.map(i => `<p class="text-[10px] text-slate-200 font-medium leading-tight">${i}</p>`).join('')}
            </div>
          </div>

          <!-- Exam Trap Alert -->
          <div class="p-2.5 rounded-xl bg-rose-950/40 border border-rose-500/40">
            <div class="flex items-center gap-1.5 text-[9px] font-extrabold text-rose-400 uppercase tracking-wide">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span>ICAI Critical Exam Trap:</span>
            </div>
            <p class="text-[9.5px] text-slate-200 mt-1 leading-tight font-medium">${data.trap}</p>
          </div>
        </div>

        <!-- Bottom Exam Hack Footer -->
        <div class="space-y-1.5 pt-2 border-t border-white/10">
          <div class="p-2 rounded-xl bg-gradient-to-r from-amber-500/20 via-indigo-500/20 to-emerald-500/20 border border-amber-400/40 text-center">
            <span class="text-[9px] font-black uppercase text-amber-300 tracking-wider">⚡ 10-Second Concept Hack</span>
            <p class="text-[10px] font-bold text-white mt-0.5 leading-tight">${data.hack}</p>
          </div>

          <div class="flex items-center justify-between text-[8.5px] text-slate-400 px-1 font-semibold">
            <span>CA INTER SPEED REVISION</span>
            <span class="mono text-amber-400 font-bold">#MissionCA</span>
          </div>
        </div>
      `;
    }

    function renderQuizCard() {
      const data = curriculum[currentDayIndex];
      const card = document.getElementById('statusCanvas');
      card.style.background = "#070b19";
      card.style.borderColor = "rgba(99, 102, 241, 0.5)";

      const opts = data.quiz.opts || data.quiz.options;
      const optHtml = opts.map((opt, i) => `
        <button onclick="checkAnswer(${i}, ${data.quiz.ans !== undefined ? data.quiz.ans : data.quiz.correct})" class="quiz-opt-btn w-full text-left p-3 rounded-2xl glass-surface border border-white/10 hover:border-indigo-400/60 transition-all flex items-center justify-between text-xs font-semibold text-slate-200">
          <span>${opt}</span>
          <span class="text-[9px] mono px-2 py-0.5 rounded bg-white/5 text-slate-400">#${i+1}</span>
        </button>
      `).join('');

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <span class="text-[10px] font-black tracking-wider uppercase px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
              <i class="fa-solid fa-stopwatch mr-1"></i> QUICK TEST • ${data.day}
            </span>
            <span class="text-[9px] mono text-slate-400 uppercase">${data.subjectTag}</span>
          </div>

          <div class="mt-4">
            <span class="text-[10px] text-amber-400 font-extrabold uppercase tracking-wider">Concept Verification</span>
            <h3 class="text-sm font-black text-white mt-1 leading-snug">${data.quiz.q}</h3>
          </div>
        </div>

        <div class="space-y-2 my-auto">
          ${optHtml}
        </div>

        <div class="p-3 rounded-2xl glass-surface border border-white/10 text-[10.5px] text-slate-300" id="quizFeedback">
          💡 Select the most appropriate option according to ICAI Module.
        </div>
      `;
    }

    function checkAnswer(chosen, correct) {
      const btns = document.querySelectorAll('.quiz-opt-btn');
      btns.forEach((b, idx) => {
        b.disabled = true;
        if(idx === correct) {
          b.className = "w-full text-left p-3 rounded-2xl bg-emerald-950/80 border border-emerald-500 text-xs font-bold text-emerald-300 flex items-center justify-between";
        } else if(idx === chosen) {
          b.className = "w-full text-left p-3 rounded-2xl bg-rose-950/80 border border-rose-500 text-xs font-bold text-rose-300 flex items-center justify-between";
        }
      });

      const feedback = document.getElementById('quizFeedback');
      const isRight = chosen === correct;
      feedback.innerHTML = `
        <span class="font-black ${isRight ? 'text-emerald-400' : 'text-amber-400'}">
          ${isRight ? '✅ Correct Answer!' : '❌ Incorrect!'}
        </span>
        <p class="mt-1">${curriculum[currentDayIndex].quiz.exp}</p>
      `;
    }

    function downloadPoster() {
      // Always switch to status view for download
      if(isQuizMode) toggleCardMode();

      const card = document.getElementById('statusCanvas');
      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const a = document.createElement('a');
        a.download = `CA_Inter_${curriculum[currentDayIndex].day.replace(' ', '_')}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }

    function copyCaption() {
      const d = curriculum[currentDayIndex];
      const text = `⚖️ CA INTER SPEED REVISION [${d.day}] • ${d.subject}\n🔥 TOPIC: ${d.topicTitle} (${d.subtitle})\n\n📌 KEY CONCEPTS:\n${d.col1.title}: ${d.col1.badge}\n${d.col2.title}: ${d.col2.badge}\n\n⚠️ ICAI EXAM TRAP:\n${d.trap}\n\n⚡ 10-SEC HACK:\n${d.hack}\n\n#CAInter #ICAI #RevisionHub #DailyStatus`;
      
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtnText');
        btn.innerText = "Copied! ✅";
        setTimeout(() => { btn.innerText = "Caption"; }, 2000);
      });
    }

    function showQuickGuide() {
      alert(`🎯 CA INTER HACK:\n${curriculum[currentDayIndex].hack}\n\n⚠️ ICAI TRAP:\n${curriculum[currentDayIndex].trap}`);
    }

    window.onload = init;
  </script>
</body>
</html>
